name: Automatische materiaalmeldingen
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: material-mail
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Controleer configuratie en verwerk meldingen
        env:
          MAIL_JOB_TOKEN: ${{ secrets.MATERIAL_MAIL_JOB_TOKEN }}
        run: |
          if [ -z "$MAIL_JOB_TOKEN" ]; then
            echo 'Mailing niet geactiveerd: MATERIAL_MAIL_JOB_TOKEN ontbreekt.'
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 240 \
            -X POST 'https://qmhzollowjbarzbnibdf.supabase.co/functions/v1/material-mail' \
            -H "Authorization: Bearer $MAIL_JOB_TOKEN"
